[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "microcosm-backend"
version = "0.1.0"
description = "K-COSMOS sustainability backend foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.19.1,<2.0",
  "argon2-cffi>=25.1.0,<26.0",
  "fastapi>=0.141.1,<0.142",
  "psycopg[binary,pool]>=3.3.4,<4.0",
  "pydantic>=2.13.5,<3.0",
  "pydantic-settings>=2.10.1,<3.0",
  "python-multipart>=0.0.32,<0.1",
  "sqlalchemy>=2.0.52,<2.1",
  "structlog>=25.4.0,<26.0",
  "uvicorn[standard]>=0.52.4,<0.53",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<0.29",
  "mypy>=1.17.1,<2.0",
  "pytest>=8.4.1,<9.0",
  "pytest-asyncio>=1.1.0,<2.0",
  "ruff>=0.12.11,<0.13",
]
# Only the Aeron ingestion worker needs a browser; the API image does not.
aeron-worker = [
  "playwright>=1.63.0,<1.64",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"app/models/*.py" = ["E501"]
"tests/*.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
