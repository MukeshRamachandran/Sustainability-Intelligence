name: microcosm-local

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: microcosm
      POSTGRES_USER: microcosm_app
      POSTGRES_PASSWORD: microcosm_dev_only
    volumes:
      - microcosm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microcosm_app -d microcosm"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    environment:
      APP_ENV: development
      # The active development database. `microcosm` was contaminated with
      # synthetic integration-test data (772 users, 461 periods, 41 releases,
      # an active release for a fabricated 2030-11 period) and is retained
      # unchanged for forensics - it is never dropped. Override
      # MICROCOSM_DATABASE_URL to point the runtime back at it.
      DATABASE_URL: ${MICROCOSM_DATABASE_URL:-postgresql+psycopg://microcosm_app:microcosm_dev_only@postgres:5432/microcosm_clean_20260922}
      LOG_LEVEL: INFO
      PUBLIC_BASE_URL: http://localhost:8000
      INSTITUTION_TIMEZONE: Asia/Kolkata
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SECRET_KEY: development-only-change-me
      CSRF_SECRET: development-csrf-change-me
      SESSION_COOKIE_NAME: microcosm_session
      CSRF_COOKIE_NAME: microcosm_csrf
      SESSION_IDLE_MINUTES: 60
      SESSION_ABSOLUTE_HOURS: 8
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAMESITE: lax
      EVIDENCE_ROOT: /data/evidence
      EVIDENCE_STORAGE_DIR: /data/evidence/clean
      MAX_EVIDENCE_FILE_SIZE_BYTES: 10485760
      ALLOWED_EVIDENCE_TYPES: application/pdf,image/png,image/jpeg
      MAX_UPLOAD_BYTES: 10485760
      LOGIN_MAX_FAILURES: 5
      LOGIN_LOCK_MINUTES: 15
      PASSWORD_MIN_LENGTH: 12
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - microcosm_evidence_quarantine:/data/evidence/quarantine
      - microcosm_evidence_clean:/data/evidence/clean
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  microcosm_postgres_data:
  microcosm_evidence_quarantine:
  microcosm_evidence_clean:
