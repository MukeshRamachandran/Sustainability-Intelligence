<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submission History - MICROCOSM Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-auth-role="manager" data-login-page="index.html">

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="manager-home.html" class="sidebar-brand" style="display: flex; align-items: center; gap: 10px; padding: 4px 0;">
          <img src="kumaraguru-microcosm-logo.png" alt="MICROCOSM - The Co-existing Architecture" style="height:auto;width:auto;max-height:48px;max-width:100%;">
        </a>
      </div>
      <nav class="sidebar-nav">
        <a href="manager-home.html" class="nav-item">Home</a>
        <a href="#" id="monthly-entry-link" class="nav-item">Monthly Entry</a>
        <a href="submission-history.html" class="nav-item active">Submission History</a>
        <a href="#" class="nav-item">Corrections</a>
        <a href="#" class="nav-item">Guidelines</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <div class="current-period">
            <span>AY: 2026–2027</span>
            <span>|</span>
            <span>June 2026</span>
          </div>
        </div>
        <div class="topbar-right">
          <span class="user-badge" id="user-role-badge">Manager</span>
          <button class="btn btn-outline" id="logout-btn">Logout</button>
        </div>
      </header>

      <div class="content-area">
        <div class="mb-3 d-flex justify-between align-center">
          <div>
            <h1>Submission History</h1>
            <p>View your past monthly data entries and their approval status.</p>
          </div>
        </div>

        <div class="glass-card">
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Submission ID</th>
                  <th>Period</th>
                  <th>Type</th>
                  <th>Submitted At</th>
                  <th>Status</th>
                  <th>Admin Comment</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="history-table-body">
                <!-- Rows will be injected by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="auth-client.js"></script>
  <script src="role-auth.js"></script>
  <script src="app.js"></script>
  <script src="manager-history.js"></script>
</body>
</html>
