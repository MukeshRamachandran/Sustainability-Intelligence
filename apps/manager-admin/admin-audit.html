<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Audit Log - MICROCOSM Portal</title><link rel="stylesheet" href="styles.css"></head>
<body data-auth-role="microcosm_admin" data-login-page="admin-login.html">
  <div class="app-container">
    <aside class="sidebar"><div class="sidebar-header"><a href="admin-overview.html" class="sidebar-brand" style="display:flex;align-items:center;gap:10px;padding:4px 0;"><img src="kumaraguru-microcosm-logo.png" alt="MICROCOSM" style="height:auto;width:auto;max-height:48px;max-width:100%;"></a></div><nav class="sidebar-nav"><a href="admin-overview.html" class="nav-item">Admin Overview</a><a href="admin-queue.html" class="nav-item">Approval Queue</a><a href="admin-evidence.html" class="nav-item">Evidence Repository</a><a href="admin-certificates.html" class="nav-item">Certificates</a><a href="admin-factors.html" class="nav-item">Emission Factors</a><a href="admin-preview.html" class="nav-item">Dashboard Preview</a><a href="admin-users.html" class="nav-item">Managers &amp; Access</a><a href="admin-audit.html" class="nav-item active">Audit Log</a></nav></aside>
    <main class="main-content">
      <header class="topbar"><div class="topbar-left"><div class="current-period"><span>K-COSMOS</span><span>|</span><span>Administration</span></div></div><div class="topbar-right"><span class="user-badge">Admin</span><button class="btn btn-outline" id="logout-btn">Logout</button></div></header>
      <div class="content-area">
        <div class="mb-3"><h1>System Audit Log</h1><p>Read-only, administrator-only security and workflow history.</p></div>
        <form id="audit-filter-form" class="glass-card mb-3"><div class="grid-4"><div class="form-group"><label for="audit-action">Action</label><input id="audit-action" class="form-control" maxlength="120" placeholder="e.g. auth.login"></div><div class="form-group"><label for="audit-actor">Actor</label><input id="audit-actor" class="form-control" maxlength="160" placeholder="Username or display name"></div><div class="form-group"><label for="audit-domain">Domain</label><select id="audit-domain" class="form-control"><option value="">All domains</option><option>transport</option><option>energy</option><option>lpg</option><option>water</option><option>outreach</option></select></div><div class="form-group"><label for="audit-from">From</label><input id="audit-from" type="date" class="form-control"></div><div class="form-group"><label for="audit-to">To</label><input id="audit-to" type="date" class="form-control"></div></div><div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Apply Filters</button><button class="btn btn-outline" id="audit-clear-btn" type="button">Clear</button></div></form>
        <div class="glass-card"><div class="table-responsive"><table class="table"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Domain</th><th>Resource</th><th>Result</th><th>Details</th><th>Request ID</th></tr></thead><tbody id="audit-table-body"><tr><td colspan="8">Loading…</td></tr></tbody></table></div><div class="d-flex justify-between align-center"><span id="audit-page-status" class="text-muted"></span><div class="d-flex gap-2"><button class="btn btn-outline" id="audit-prev-btn" type="button">Previous</button><button class="btn btn-outline" id="audit-next-btn" type="button">Next</button></div></div></div>
      </div>
    </main>
  </div>
  <script src="auth-client.js"></script><script src="role-auth.js"></script><script src="app.js"></script><script src="admin-audit.js"></script>
</body>
</html>
