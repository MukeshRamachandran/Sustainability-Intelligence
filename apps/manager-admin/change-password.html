<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Change Password - K-COSMOS</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="role-login.css"></head>
<body>
  <div class="login-container">
    <section class="login-left"><img src="microcosm-login-logo.png" alt="MICROCOSM" style="height:130px;width:auto;margin-bottom:24px;"><p style="font-size:18px;color:white;font-weight:600;margin-bottom:8px;">Sustainability Data Workflow</p><small style="color:rgba(255,255,255,.75);">Official ESG &amp; Environmental Governance Portal</small></section>
    <section class="login-right"><div class="glass-card login-card"><div class="login-card-header"><h2>Change Password</h2><p>You must change your temporary password before continuing.</p></div>
      <form id="change-password-form">
        <div class="form-group"><label class="form-label" for="current-password">Current Password</label><input class="form-control" id="current-password" type="password" autocomplete="current-password" required></div>
        <div class="form-group"><label class="form-label" for="new-password">New Password</label><input class="form-control" id="new-password" type="password" autocomplete="new-password" minlength="12" required></div>
        <div class="form-group"><label class="form-label" for="confirm-password">Confirm New Password</label><input class="form-control" id="confirm-password" type="password" autocomplete="new-password" minlength="12" required></div>
        <button type="submit" class="btn btn-primary btn-block">Change Password</button><p id="change-password-message" class="text-center text-muted" style="margin-top:12px;min-height:20px;" aria-live="polite"></p>
      </form>
    </div></section>
  </div>
  <script src="auth-client.js"></script><script src="role-auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const form=document.getElementById('change-password-form');
      const message=document.getElementById('change-password-message');
      try { const session=await getSession(); if(!session.user.must_change_password) KCosmosAuth.routeAuthenticatedUser(session); }
      catch (_) { window.location.replace('index.html'); return; }
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const current=document.getElementById('current-password'); const next=document.getElementById('new-password'); const confirm=document.getElementById('confirm-password');
        if(next.value!==confirm.value){message.textContent='New passwords do not match.';return;}
        if(next.value.length<12){message.textContent='Password must contain at least 12 characters.';return;}
        const button=form.querySelector('button[type="submit"]'); button.disabled=true; message.textContent='Changing password...';
        try { await changePassword(current.value,next.value); form.reset(); KCosmosAuth.routeAuthenticatedUser(await getSession()); }
        catch(error){message.textContent=error.message; button.disabled=false;}
      });
    });
  </script>
</body>
</html>
