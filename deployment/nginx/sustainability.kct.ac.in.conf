# Public entry point for sustainability.kct.ac.in.
# Cloudflare terminates visitor TLS. This origin still serves HTTPS
# (Full strict) and is the only process that should be reachable on 443.
#
# Install:
#   sudo cp deployment/nginx/cloudflare-real-ip.conf /etc/nginx/snippets/kcosmos-cloudflare-real-ip.conf
#   sudo cp deployment/nginx/security-headers.conf /etc/nginx/snippets/kcosmos-security-headers.conf
#   sudo cp deployment/nginx/sustainability.kct.ac.in.conf /etc/nginx/sites-available/sustainability.kct.ac.in.conf
#   sudo ln -s /etc/nginx/sites-available/sustainability.kct.ac.in.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace the ssl_certificate paths with the Cloudflare Origin CA files.
# Brotli is not enabled here: the ngx_brotli module is not part of stock
# Ubuntu Nginx, and an unknown directive would fail nginx -t. Gzip is on.
# Enable brotli in the http block only after the module is installed.

upstream kcosmos_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream kcosmos_public {
    server 127.0.0.1:3001;
    keepalive 8;
}

upstream kcosmos_admin {
    server 127.0.0.1:3002;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name sustainability.kct.ac.in;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sustainability.kct.ac.in;

    ssl_certificate     /etc/ssl/cloudflare/sustainability.kct.ac.in.pem;
    ssl_certificate_key /etc/ssl/cloudflare/sustainability.kct.ac.in.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:kcosmos_ssl:10m;

    server_tokens off;
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    access_log /var/log/nginx/sustainability.access.log;
    error_log  /var/log/nginx/sustainability.error.log warn;

    include /etc/nginx/snippets/kcosmos-cloudflare-real-ip.conf;
    include /etc/nginx/snippets/kcosmos-security-headers.conf;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location /api/ {
        proxy_pass http://kcosmos_api;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/kcosmos-security-headers.conf;
    }

    location /health/ {
        proxy_pass http://kcosmos_api;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/kcosmos-security-headers.conf;
    }

    location = /admin {
        return 301 /admin/;
    }

    # Trailing slash on proxy_pass strips the /admin/ prefix so the
    # static server sees /admin-login.html, /styles.css, and so on.
    # Browser URLs stay under /admin/ because HTML uses relative links.
    location /admin/ {
        proxy_pass http://kcosmos_admin/;
    }

    location / {
        proxy_pass http://kcosmos_public;
    }
}
